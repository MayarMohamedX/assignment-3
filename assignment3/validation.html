<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <title>Registration Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 50px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input {
        width: 300px;
        padding: 8px;
      }
      .error {
        color: red;
        font-size: 12px;
        display: block;
        margin-top: 3px;
      }
      button {
        padding: 10px 20px;
        background: #009688;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Registration Form</h2>
    <form id="regForm">
      <div class="form-group">
        <label>Name:</label>
        <input type="text" id="name" />
        <span class="error" id="nameError"></span>
      </div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" />
        <span class="error" id="emailError"></span>
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" />
        <span class="error" id="passwordError"></span>
      </div>
      <div class="form-group">
        <label>Confirm Password:</label>
        <input type="password" id="confirmPassword" />
        <span class="error" id="confirmPasswordError"></span>
      </div>
      <div class="form-group">
        <label>Age:</label>
        <input type="number" id="age" />
        <span class="error" id="ageError"></span>
      </div>
      <button type="submit">Register</button>
    </form>

    <script>
      document
        .getElementById("regForm")
        .addEventListener("submit", function (e) {
          let isValid = true;

          // Name validation
          let name = document.getElementById("name").value.trim();
          let nameError = document.getElementById("nameError");
          if (name === "") {
            nameError.textContent = "Name cannot be blank.";
            isValid = false;
          } else {
            nameError.textContent = "";
          }

          // Email validation
          let email = document.getElementById("email").value.trim();
          let emailError = document.getElementById("emailError");
          let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/; <!--as com, org, net-->
          if (!email.match(emailPattern)) {
            emailError.textContent = "Please enter a valid email address.";
            isValid = false;
          } else {
            emailError.textContent = "";
          }

          // Password validation
          let password = document.getElementById("password").value;
          let passwordError = document.getElementById("passwordError");
          if (password.length < 8) {
            passwordError.textContent =
              "Password must be at least 8 characters.";
            isValid = false;
          } else {
            passwordError.textContent = "";
          }

          // Confirm password validation
          let confirmPassword =
            document.getElementById("confirmPassword").value;
          let confirmPasswordError = document.getElementById(
            "confirmPasswordError",
          );
          if (confirmPassword !== password) {
            confirmPasswordError.textContent = "Passwords do not match.";
            isValid = false;
          } else {
            confirmPasswordError.textContent = "";
          }

          // Age validation
          let age = document.getElementById("age").value;
          let ageError = document.getElementById("ageError");
          if (age === "" || age < 18) {
            ageError.textContent = "You must be at least 18 years old.";
            isValid = false;
          } else {
            ageError.textContent = "";
          }

          // Stop submission if invalid
          if (!isValid) {
            e.preventDefault();
          }
        });
    </script>
  </body>
</html>
